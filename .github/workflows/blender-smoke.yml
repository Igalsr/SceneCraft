name: Blender smoke

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download pinned Blender
        run: |
          curl --fail --location --output /tmp/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
          echo "da4e69b06b75b9e642d106496c50e7e240218b411d2f6e18271c1d1d819cef91  /tmp/blender.tar.xz" | sha256sum --check -
          mkdir /tmp/blender
          tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /tmp/blender
      - run: pytest -q tests/test_blender_smoke.py
        env:
          SCENECRAFT_BLENDER: /tmp/blender/blender
