name: Blender smoke

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download pinned Blender
        run: |
          curl --fail --location --output /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  /tmp/blender.tar.xz" | sha256sum --check -
          mkdir /tmp/blender
          tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /tmp/blender
      - run: pytest -q tests/test_blender_smoke.py
        env:
          SCENECRAFT_BLENDER: /tmp/blender/blender
